<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 회원가입</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/auth.css" />
    <style>
      .input-error {
        border: 1px solid red;
        background-color: #fff5f5;
      }
      .error-message {
        color: red;
        font-size: 12px;
        margin-top: 4px;
      }
      .disabled-button {
        background-color: gray !important;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body>
    <div class="auth-container">
      <a href="/" class="logo-home-button">
        <img src="images/logo/logo.svg" alt="판다마켓 홈" />
      </a>

      <form id="signup-form">
        <div class="input-item">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" placeholder="이메일을 입력해 주세요" />
          <p class="error-message" id="email-error"></p>
        </div>
        <div class="input-item">
          <label for="nickname">닉네임</label>
          <input id="nickname" name="nickname" type="text" placeholder="닉네임을 입력해 주세요" />
          <p class="error-message" id="nickname-error"></p>
        </div>
        <div class="input-item">
          <label for="password">비밀번호</label>
          <div class="input-wrapper">
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해 주세요" />
            <img src="images/icons/eye-invisible.svg" alt="비밀번호 숨김" class="toggle-password" id="toggle-password" />
          </div>
          <p class="error-message" id="password-error"></p>
        </div>
        <div class="input-item">
          <label for="passwordConfirmation">비밀번호 확인</label>
          <div class="input-wrapper">
            <input id="passwordConfirmation" name="passwordConfirmation" type="password" placeholder="비밀번호를 다시 한 번 입력해 주세요" />
            <img src="images/icons/eye-invisible.svg" alt="비밀번호 숨김" class="toggle-password" id="toggle-password-confirm" />
          </div>
          <p class="error-message" id="confirm-error"></p>
        </div>

        <button type="submit" id="submit-btn" class="button pill-button full-width disabled-button" disabled>
          회원가입
        </button>
      </form>

      <div class="social-login-container">
        <h3>간편 로그인하기</h3>
        <div class="social-login-buttons-container">
          <a href="https://www.google.com/" target="_blank">
            <img src="images/social/google-logo.png" alt="구글 로그인" width="42" />
          </a>
          <a href="https://www.kakaocorp.com/page/" target="_blank">
            <img src="images/social/kakao-logo.png" alt="카카오톡 로그인" width="42" />
          </a>
        </div>
      </div>

      <div class="auth-switch">
        이미 회원이신가요? <a href="signin.html">로그인</a>
      </div>
    </div>

    <script>
      const email = document.getElementById('email');
      const nickname = document.getElementById('nickname');
      const password = document.getElementById('password');
      const passwordConfirm = document.getElementById('passwordConfirmation');
      const submitBtn = document.getElementById('submit-btn');

      const emailError = document.getElementById('email-error');
      const nicknameError = document.getElementById('nickname-error');
      const passwordError = document.getElementById('password-error');
      const confirmError = document.getElementById('confirm-error');

      const togglePassword = document.getElementById('toggle-password');
      const togglePasswordConfirm = document.getElementById('toggle-password-confirm');

      const validate = () => {
        let isValid = true;

        // 이메일
        if (!email.value) {
          email.classList.add('input-error');
          emailError.textContent = '이메일을 입력해주세요.';
          isValid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
          email.classList.add('input-error');
          emailError.textContent = '잘못된 이메일 형식입니다';
          isValid = false;
        } else {
          email.classList.remove('input-error');
          emailError.textContent = '';
        }

        // 닉네임
        if (!nickname.value) {
          nickname.classList.add('input-error');
          nicknameError.textContent = '닉네임을 입력해주세요.';
          isValid = false;
        } else {
          nickname.classList.remove('input-error');
          nicknameError.textContent = '';
        }

        // 비밀번호
        if (!password.value) {
          password.classList.add('input-error');
          passwordError.textContent = '비밀번호를 입력해주세요.';
          isValid = false;
        } else if (password.value.length < 8) {
          password.classList.add('input-error');
          passwordError.textContent = '비밀번호를 8자 이상 입력해주세요.';
          isValid = false;
        } else {
          password.classList.remove('input-error');
          passwordError.textContent = '';
        }

        // 비밀번호 확인
        if (passwordConfirm.value !== password.value) {
          passwordConfirm.classList.add('input-error');
          confirmError.textContent = '비밀번호가 일치하지 않습니다';
          isValid = false;
        } else {
          passwordConfirm.classList.remove('input-error');
          confirmError.textContent = '';
        }

        // 버튼 상태
        submitBtn.disabled = !isValid;
        submitBtn.classList.toggle('disabled-button', !isValid);
      };

      email.addEventListener('blur', validate);
      nickname.addEventListener('blur', validate);
      password.addEventListener('blur', validate);
      passwordConfirm.addEventListener('blur', validate);

      const toggleVisibility = (input, icon) => {
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        icon.src = visible
          ? 'images/icons/eye-invisible.svg'
          : 'images/icons/eye-visible.svg';
      };

      togglePassword.addEventListener('click', () => toggleVisibility(password, togglePassword));
      togglePasswordConfirm.addEventListener('click', () => toggleVisibility(passwordConfirm, togglePasswordConfirm));

      document.getElementById('signup-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('회원가입 완료!');
      });
    </script>
  </body>
</html>
